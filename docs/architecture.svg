<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RideMatch real-time fulfillment matching architecture</title>
  <desc id="desc">Online serving, offline simulation and evaluation, and deployment components for RideMatch.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#52605a"/></marker>
    <style>
      .title,.subtitle,.band,.node,.small,.legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #17211b; }
      .subtitle { font-size: 13px; fill: #69756d; }
      .band { font-size: 13px; font-weight: 700; fill: #52605a; }
      .node { font-size: 13px; font-weight: 600; text-anchor: middle; fill: #17211b; }
      .small { font-size: 11px; text-anchor: middle; fill: #52605a; }
      .legend { font-size: 11px; fill: #52605a; }
      .box { stroke-width: 1.5; rx: 9; }
      .online { fill: #e6f3eb; stroke: #277453; }
      .offline { fill: #e9f2fb; stroke: #3976ad; }
      .output { fill: #fff1df; stroke: #c66a2e; }
      .infra { fill: #f0f2f0; stroke: #69756d; }
      .artifact { fill: #f7f7f5; stroke: #52605a; }
      .flow { fill: none; stroke: #52605a; stroke-width: 1.7; marker-end: url(#arrow); }
      .deploy { fill: none; stroke: #69756d; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="550" y="37" class="title" text-anchor="middle">RideMatch: Real-Time Fulfillment Matching Architecture</text>
  <text x="550" y="59" class="subtitle" text-anchor="middle">Synthetic marketplace simulation, learned candidate ranking, policy replay, and production-style serving</text>

  <rect x="25" y="80" width="1050" height="165" fill="#fbfdfb" stroke="#d9e1da"/>
  <text x="45" y="101" class="band">ONLINE SERVING</text>
  <rect x="45" y="135" width="140" height="60" class="box online"/>
  <text x="115" y="158" class="node">Rider / Dispatcher</text><text x="115" y="176" class="node">UI</text><text x="115" y="190" class="small">map + pickup pin</text>
  <rect x="220" y="135" width="140" height="60" class="box online"/>
  <text x="290" y="158" class="node">FastAPI</text><text x="290" y="176" class="node">Matching API</text><text x="290" y="190" class="small">POST /match</text>
  <rect x="395" y="135" width="140" height="60" class="box online"/>
  <text x="465" y="158" class="node">Shared Feature</text><text x="465" y="176" class="node">Builder</text><text x="465" y="190" class="small">12 inputs</text>
  <rect x="570" y="135" width="140" height="60" class="box online"/>
  <text x="640" y="167" class="node">Utility GBDT</text><text x="640" y="185" class="small">predict utility</text>
  <rect x="745" y="135" width="140" height="60" class="box online"/>
  <text x="815" y="158" class="node">Candidate</text><text x="815" y="176" class="node">Ranker</text><text x="815" y="190" class="small">score + select</text>
  <rect x="920" y="135" width="140" height="60" class="box output"/>
  <text x="990" y="158" class="node">Match</text><text x="990" y="176" class="node">Response</text><text x="990" y="190" class="small">driver + ETA</text>
  <path d="M185 165 H220 M360 165 H395 M535 165 H570 M710 165 H745 M885 165 H920" class="flow"/>
  <path d="M990 135 V112 H115 V135" class="flow"/>

  <rect x="25" y="365" width="1050" height="235" fill="#fbfcfe" stroke="#d9e1da"/>
  <text x="45" y="386" class="band">OFFLINE ML AND POLICY EVALUATION</text>
  <rect x="45" y="415" width="140" height="60" class="box offline"/>
  <text x="115" y="438" class="node">Dynamic City</text><text x="115" y="456" class="node">Simulator</text><text x="115" y="470" class="small">40 x 40 km + fleet</text>
  <rect x="220" y="415" width="140" height="60" class="box offline"/>
  <text x="290" y="438" class="node">Candidate</text><text x="290" y="456" class="node">Dataset</text><text x="290" y="470" class="small">pairs + features</text>
  <rect x="395" y="415" width="140" height="60" class="box offline"/>
  <text x="465" y="438" class="node">Chronological</text><text x="465" y="456" class="node">Training</text><text x="465" y="470" class="small">time split</text>
  <rect x="570" y="415" width="140" height="60" class="box artifact"/>
  <text x="640" y="438" class="node">Trained Model</text><text x="640" y="456" class="node">Artifact</text><text x="640" y="470" class="small">utility_model.pkl</text>
  <rect x="220" y="510" width="140" height="60" class="box offline"/>
  <text x="290" y="533" class="node">Delayed</text><text x="290" y="551" class="node">Outcomes</text><text x="290" y="565" class="small">accept, cancel, wait</text>
  <rect x="395" y="510" width="140" height="60" class="box offline"/>
  <text x="465" y="533" class="node">Policy</text><text x="465" y="551" class="node">Replay</text><text x="465" y="565" class="small">same request stream</text>
  <rect x="570" y="510" width="140" height="60" class="box output"/>
  <text x="640" y="533" class="node">Fulfillment</text><text x="640" y="551" class="node">KPIs</text><text x="640" y="565" class="small">wait, SLA, coverage</text>
  <rect x="745" y="510" width="140" height="60" class="box output"/>
  <text x="815" y="533" class="node">Reference</text><text x="815" y="551" class="node">Reports</text><text x="815" y="565" class="small">CSV by seed</text>
  <path d="M185 445 H220 M360 445 H395 M535 445 H570 M115 475 V540 H220 M360 540 H395 M535 540 H570 M710 540 H745" class="flow"/>
  <!-- Shared model artifact -> online Utility GBDT. -->
  <path d="M640 415 V195" class="flow"/>
  <text x="685" y="345" class="small" text-anchor="start">model serving</text>
  <!-- Shared model artifact -> offline Policy Replay. -->
  <path d="M570 445 L535 510" class="flow"/>
  <text x="590" y="493" class="small" text-anchor="end">replay input</text>

  <rect x="25" y="255" width="550" height="90" fill="#fcfcfc" stroke="#d9e1da"/>
  <text x="45" y="276" class="band">DEPLOYMENT</text>
  <rect x="220" y="285" width="150" height="45" class="box infra"/>
  <text x="300" y="304" class="node">Docker Compose</text><text x="300" y="319" class="small">local API + model</text>
  <rect x="390" y="285" width="150" height="45" class="box infra"/>
  <text x="460" y="304" class="node">Vercel</text><text x="460" y="319" class="small">api/index.py</text>
  <text x="120" y="304" class="small">FastAPI deployment targets</text>
  <!-- Deployment arrows intentionally use the gap between the two processing bands. -->
  <path d="M290 195 V285" class="deploy"/>
  <path d="M290 195 V230 H460 V285" class="deploy"/>

  <rect x="900" y="405" width="150" height="92" fill="#ffffff" stroke="#d9e1da" rx="6"/>
  <text x="913" y="425" class="legend" font-weight="700">Legend</text>
  <rect x="913" y="436" width="16" height="12" class="box online"/><text x="937" y="446" class="legend">online serving</text>
  <rect x="913" y="456" width="16" height="12" class="box offline"/><text x="937" y="466" class="legend">offline ML</text>
  <rect x="913" y="476" width="16" height="12" class="box output"/><text x="937" y="486" class="legend">KPIs / outputs</text>
</svg>
